name: Refresh official PVE cloud images
'on':
  workflow_dispatch:
    inputs:
      distro:
        description: Official image source to refresh
        type: choice
        default: all
        options:
        - all
        - almalinux
        - alpine
        - archlinux
        - centos
        - debian
        - rockylinux
        - ubuntu
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Refresh validated official image sources
      env:
        GH_TOKEN: ${{ github.token }}
        DISTRO: ${{ inputs.distro }}
      run: |
        set -euo pipefail
        source .github/scripts/ci_network.sh
        if [[ "$DISTRO" == all ]]; then distros=(almalinux alpine archlinux centos debian rockylinux ubuntu); else distros=("$DISTRO"); fi
        for distro in "${distros[@]}"; do
          gh workflow run "${distro}.yml" --ref main --repo "$GITHUB_REPOSITORY"
        done
