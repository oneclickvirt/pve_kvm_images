name: Build CentOS Cloud Images
jobs:
  build_centos_cloud_images:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: check path
      run: |
        pwd
    - name: Configure Git
      run: |
        git config --global user.name "daily-update"
        git config --global user.email "tg@spiritlhl.top"
    - name: Environment preparation
      run: |
        set -euo pipefail
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends curl wget unzip zip jq libguestfs-tools qemu-utils axel rng-tools
        if [[ -c /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
    - name: Build CentOS Images
      run: "set -euo pipefail\nuploaded_images=0\nexport LIBGUESTFS_BACKEND=direct\nexport LIBGUESTFS_BACKEND_SETTINGS=\"\
        passt:no\"\ndeclare -A centos_versions\ncentos_versions[\"9\"]=\"9\"\ncentos_versions[\"8\"]=\"8\"\n# centos_versions[\"\
        7\"]=\"7\"\nfor version in \"9\" \"8\"; do\n    echo \"=== Processing CentOS $version ===\"\n    rm -f centos-${version}.qcow2\
        \ centos-${version}-custom.qcow2 centos${version}.qcow2 centos-${version}.qcow2.bak\n    echo \"Downloading CentOS\
        \ $version Cloud Image\"\n    if [ \"$version\" = \"9\" ]; then\n        download_url=\"https://cloud.centos.org/centos/9-stream/x86_64/images/CentOS-Stream-GenericCloud-9-latest.x86_64.qcow2\"\
        \n    elif [ \"$version\" = \"8\" ]; then\n        download_url=\"https://cloud.centos.org/centos/8-stream/x86_64/images/CentOS-Stream-GenericCloud-8-latest.x86_64.qcow2\"\
        \n    # elif [ \"$version\" = \"7\" ]; then\n    #     download_url=\"https://cloud.centos.org/centos/7/images/CentOS-7-x86_64-GenericCloud.qcow2\"\
        \n    fi\n    if ! axel -n 8 -o centos-${version}.qcow2 \"$download_url\" 2>/dev/null; then\n        echo \"Axel failed,\
        \ trying with curl\"\n        if ! curl -fL --retry 3 --retry-delay 5 -o centos-${version}.qcow2 \"$download_url\"\
        ; then\n            echo \"Failed to download CentOS $version, skipping...\"\n            rm -f centos-${version}.qcow2\n\
        \            continue\n        fi\n    fi\n    if [ ! -f \"centos-${version}.qcow2\" ] || [ $(stat -c %s \"centos-${version}.qcow2\"\
        ) -lt 10485760 ]; then\n        echo \"Download failed or file too small for CentOS $version, skipping...\"\n    \
        \    rm -f centos-${version}.qcow2\n        continue\n    fi\n    chmod 644 centos-${version}.qcow2\n    echo \"Customizing\
        \ CentOS $version image\"\n    if [ \"$version\" = \"7\" ]; then\n        package_manager=\"yum\"\n        grub_config_path=\"\
        /boot/grub2/grub.cfg\"\n    else\n        package_manager=\"dnf\"\n        grub_config_path=\"/boot/grub2/grub.cfg\"\
        \n    fi\n    \n    # 对于 CentOS 8，配置阿里云源（EOL 后使用 vault 作备用）\n    if [ \"$version\" != \"9\" ]; then\n      virt-customize\
        \ -a centos-${version}.qcow2 \\\n        --run-command \"sed -i -e 's|^mirrorlist=|#mirrorlist=|g' -e 's|^metalink=|#metalink=|g'\
        \ -e 's|^#baseurl=http://mirror.centos.org|baseurl=https://mirrors.aliyun.com|g' -e 's|^baseurl=http://mirror.centos.org|baseurl=https://mirrors.aliyun.com|g'\
        \ -e 's|^#baseurl=https://mirror.centos.org|baseurl=https://mirrors.aliyun.com|g' -e 's|^baseurl=https://mirror.centos.org|baseurl=https://mirrors.aliyun.com|g'\
        \ /etc/yum.repos.d/CentOS-*.repo 2>/dev/null || true\" \\\n        --run-command \"sed -i -e 's|^mirrorlist=|#mirrorlist=|g'\
        \ -e 's|^metalink=|#metalink=|g' -e 's|http://vault.centos.org|https://mirrors.aliyun.com|g' /etc/yum.repos.d/CentOS-*.repo\
        \ 2>/dev/null || true\" || true\n    fi\n    \n    # 配置镜像并预装软件包（编译阶段完成，减少首次启动时间）\n    if ! virt-customize -a centos-${version}.qcow2\
        \ \\\n      --run-command \"echo 'nameserver 8.8.8.8' > /etc/resolv.conf; echo 'nameserver 1.1.1.1' >> /etc/resolv.conf\"\
        \ \\\n      --timezone Asia/Hong_Kong \\\n      --append-line \"/etc/default/grub:# disables OS prober to avoid loopback\
        \ detection which breaks booting\" \\\n      --append-line \"/etc/default/grub:GRUB_DISABLE_OS_PROBER=true\" \\\n\
        \      --run-command \"grub2-mkconfig -o $grub_config_path || true\" \\\n      --run-command \"systemctl enable serial-getty@ttyS1.service\
        \ || true\" \\\n      --append-line \"/etc/systemd/timesyncd.conf:NTP=time.apple.com time.windows.com\" \\\n     \
        \ --run-command \"($package_manager install -y epel-release --allowerasing || $package_manager install -y epel-release\
        \ || true)\" \\\n      --run-command \"$package_manager install -y sudo qemu-guest-agent bash-completion unzip wget\
        \ curl net-tools iputils nano screen less vim bzip2 mtr htop bind-utils zstd cronie lsof || true\" \\\n      --run-command\
        \ \"($package_manager install -y spice-vdagent lldpad || true)\" \\\n      --run-command \"systemctl enable qemu-guest-agent\
        \ || true\" \\\n      --run-command \"$package_manager -y autoremove && $package_manager -y clean all || true\" \\\
        \n      --delete \"/var/log/*.log\" \\\n      --truncate \"/etc/machine-id\"; then\n        echo \"Failed to configure\
        \ CentOS $version, skipping...\"\n        rm -f centos-${version}.qcow2\n        continue\n    fi\n    echo \"Fixing\
        \ cloud-init configuration for CentOS $version...\"\n    sudo timeout --kill-after=30s 45m virt-customize -a centos-${version}.qcow2\
        \ --run-command \"sed -i 's/ssh_pwauth:[[:space:]]*false/ssh_pwauth: true/g' /etc/cloud/cloud.cfg\"\n    sudo timeout\
        \ --kill-after=30s 45m virt-customize -a centos-${version}.qcow2 --run-command \"sed -i 's/ssh_pwauth:[[:space:]]*0/ssh_pwauth:\
        \ 1/g' /etc/cloud/cloud.cfg\"\n    sudo timeout --kill-after=30s 45m virt-customize -a centos-${version}.qcow2 --run-command\
        \ \"sed -i 's/disable_root:[[:space:]]*true/disable_root: false/g' /etc/cloud/cloud.cfg\"\n    sudo timeout --kill-after=30s\
        \ 45m virt-customize -a centos-${version}.qcow2 --run-command \"sed -i 's/disable_root:[[:space:]]*1/disable_root:\
        \ 0/g' /etc/cloud/cloud.cfg\"\n    echo \"Configuring SSH and root access for CentOS $version...\"\n    if [[ \"$version\"\
        \ == \"9\" ]]; then\n        echo \"Applying CentOS 9 specific SSH configuration...\"\n        sudo timeout --kill-after=30s\
        \ 45m virt-customize -a centos-${version}.qcow2 --run-command \"systemctl enable sshd || true\"\n        sudo timeout\
        \ --kill-after=30s 45m virt-customize -a centos-${version}.qcow2 --run-command \"find /etc/ssh/sshd_config.d/ -name\
        \ '*.conf' -exec sed -i 's/#*PermitRootLogin.*/PermitRootLogin yes/g' {} \\; 2>/dev/null || true\"\n        sudo timeout\
        \ --kill-after=30s 45m virt-customize -a centos-${version}.qcow2 --run-command \"find /etc/ssh/sshd_config.d/ -name\
        \ '*.conf' -exec sed -i 's/#*PasswordAuthentication.*/PasswordAuthentication yes/g' {} \\; 2>/dev/null || true\"\n\
        \        sudo timeout --kill-after=30s 45m virt-customize -a centos-${version}.qcow2 --run-command \"find /etc/ssh/sshd_config.d/\
        \ -name '*.conf' -exec sed -i 's/ChallengeResponseAuthentication no/ChallengeResponseAuthentication yes/g' {} \\;\
        \ 2>/dev/null || true\"\n    else\n        echo \"Applying CentOS 8 specific SSH configuration...\"\n        sudo\
        \ timeout --kill-after=30s 45m virt-customize -a centos-${version}.qcow2 --run-command \"systemctl enable sshd ||\
        \ true\"\n    fi\n    sudo timeout --kill-after=30s 45m virt-customize -a centos-${version}.qcow2 --run-command \"\
        sed -i 's/#*PermitRootLogin.*/PermitRootLogin yes/g' /etc/ssh/sshd_config\"\n    sudo timeout --kill-after=30s 45m\
        \ virt-customize -a centos-${version}.qcow2 --run-command \"sed -i 's/#*PasswordAuthentication.*/PasswordAuthentication\
        \ yes/g' /etc/ssh/sshd_config\"\n    sudo timeout --kill-after=30s 45m virt-customize -a centos-${version}.qcow2 --run-command\
        \ \"sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config\"\n    sudo timeout --kill-after=30s\
        \ 45m virt-customize -a centos-${version}.qcow2 --run-command \"sed -i 's/#*Port.*/Port 22/g' /etc/ssh/sshd_config\"\
        \n    sudo timeout --kill-after=30s 45m virt-customize -a centos-${version}.qcow2 --run-command \"sed -i 's/#*AddressFamily.*/AddressFamily\
        \ any/g' /etc/ssh/sshd_config\"\n    sudo timeout --kill-after=30s 45m virt-customize -a centos-${version}.qcow2 --run-command\
        \ \"sed -i 's/#*ListenAddress 0.0.0.0.*/ListenAddress 0.0.0.0/g' /etc/ssh/sshd_config\"\n    sudo timeout --kill-after=30s\
        \ 45m virt-customize -a centos-${version}.qcow2 --run-command \"sed -i 's/#*ListenAddress ::.*/ListenAddress ::/g'\
        \ /etc/ssh/sshd_config\"\n    echo \"Configuring qemu-guest-agent for CentOS $version...\"\n    echo \"Setting enhanced\
        \ MOTD and root password for CentOS $version...\"\n    sudo timeout --kill-after=30s 45m virt-customize -a centos-${version}.qcow2\
        \ --run-command \"echo '' > /etc/motd\"\n    sudo timeout --kill-after=30s 45m virt-customize -a centos-${version}.qcow2\
        \ --run-command \"echo 'CentOS ${version} Stream Cloud Image' >> /etc/motd\"\n    sudo timeout --kill-after=30s 45m\
        \ virt-customize -a centos-${version}.qcow2 --run-command \"echo 'Modified from https://github.com/oneclickvirt/pve_kvm_images'\
        \ >> /etc/motd\"\n    sudo timeout --kill-after=30s 45m virt-customize -a centos-${version}.qcow2 --run-command \"\
        echo 'Related repo https://github.com/spiritLHLS/pve' >> /etc/motd\"\n    sudo timeout --kill-after=30s 45m virt-customize\
        \ -a centos-${version}.qcow2 --run-command \"echo '--by https://t.me/spiritlhl' >> /etc/motd\"\n    sudo timeout --kill-after=30s\
        \ 45m virt-customize -a centos-${version}.qcow2 --run-command \"echo 'Default root password: oneclickvirt' >> /etc/motd\"\
        \n    sudo timeout --kill-after=30s 45m virt-customize -a centos-${version}.qcow2 --run-command \"echo root:oneclickvirt\
        \ | chpasswd\"\n    echo \"Applying security and performance tweaks for CentOS $version...\"\n    sudo timeout --kill-after=30s\
        \ 45m virt-customize -a centos-${version}.qcow2 --run-command \"systemctl enable crond || true\"\n    if [[ \"$version\"\
        \ == \"9\" ]]; then\n        sudo timeout --kill-after=30s 45m virt-customize -a centos-${version}.qcow2 --run-command\
        \ \"dnf clean all || true\"\n    else\n        sudo timeout --kill-after=30s 45m virt-customize -a centos-${version}.qcow2\
        \ --run-command \"yum clean all || true\"\n    fi\n    sudo timeout --kill-after=30s 45m virt-customize -a centos-${version}.qcow2\
        \ --run-command \"find /var/log -type f -name '*.log' -exec truncate -s 0 {} \\;\"\n    # 安全加固：禁用algif_aead模块（CVE防护）\n\
        \    sudo timeout --kill-after=30s 45m virt-customize -a centos-${version}.qcow2 --run-command \"mkdir -p /etc/modprobe.d\
        \ && echo 'install algif_aead /bin/false' > /etc/modprobe.d/disable-algif.conf\"\n    echo \"Creating backup and finalizing\
        \ CentOS $version image\"\n    cp centos-${version}.qcow2 centos-${version}.qcow2.bak\n    echo \"Compressing CentOS\
        \ $version image\"\n    if ! TMPDIR=\"$(pwd)\" timeout --kill-after=30s 45m virt-sparsify --compress --check-tmpdir=ignore\
        \ centos-${version}.qcow2 centos-${version}-custom.qcow2; then\n        echo \"Failed to compress CentOS $version\
        \ image, skipping...\"\n        rm -f centos-${version}.qcow2 centos-${version}-custom.qcow2 centos-${version}.qcow2.bak\n\
        \        continue\n    fi\n    mv centos-${version}-custom.qcow2 centos${version}.qcow2\n    ls -lh centos${version}.qcow2\n\
        \    file=\"centos${version}.qcow2\"\n    if [ -f \"$file\" ] && [ $(stat -c %s \"$file\") -gt 10485760 ] && [ $(stat\
        \ -c %s \"$file\") -le 2147483648 ]; then\n        echo \"Processing file: $file\"\n        release_id=$(curl -fsS\
        \ --retry 3 --connect-timeout 10 --max-time 120 -H \"Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}\" -H \"Accept:\
        \ application/vnd.github.v3+json\" \"https://api.github.com/repos/${{ github.repository }}/releases/tags/centos\"\
        \ | jq -r '.id')\n        if [ \"$release_id\" = \"null\" ] || [ -z \"$release_id\" ]; then\n            echo \"Release\
        \ 'centos' not found, please create it first\"\n            rm -f centos-${version}.qcow2 centos${version}.qcow2 centos-${version}.qcow2.bak\n\
        \            continue\n        fi\n        echo \"Found release ID: $release_id\"\n        echo \"Checking if $file\
        \ already exists in release...\"\n        existing_asset_id=$(curl -fsS --retry 3 --connect-timeout 10 --max-time\
        \ 120 -H \"Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}\" -H \"Accept: application/vnd.github.v3+json\" \"https://api.github.com/repos/${{\
        \ github.repository }}/releases/$release_id/assets\" | jq -r --arg name \"$(basename \"$file\")\" '.[] | select(.name\
        \ == $name) | .id')\n        if [ -n \"$existing_asset_id\" ] && [ \"$existing_asset_id\" != \"null\" ]; then\n  \
        \          echo \"Asset $file already exists in release, deleting existing asset...\"\n            delete_response=$(curl\
        \ -s -X DELETE -H \"Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}\" \"https://api.github.com/repos/${{ github.repository\
        \ }}/releases/assets/$existing_asset_id\")\n            echo \"$delete_response\"\n            if [ $? -eq 0 ] &&\
        \ ! echo \"$delete_response\" | grep -q \"error\"; then\n                echo \"Existing asset deleted successfully.\"\
        \n            else\n                echo \"Failed to delete existing asset for $file. Skipping file upload...\"\n\
        \                rm -f centos-${version}.qcow2 centos${version}.qcow2 centos-${version}.qcow2.bak\n              \
        \  continue\n            fi\n        else\n            echo \"No existing $file file found in release.\"\n       \
        \ fi\n        echo \"Uploading $file to release...\"\n        upload_response=$(curl -s -H \"Authorization: Bearer\
        \ ${{ secrets.GITHUB_TOKEN }}\" \\\n          -H \"Content-Type: application/octet-stream\" \\\n          -T \"$file\"\
        \ \\\n          \"https://uploads.github.com/repos/${{ github.repository }}/releases/$release_id/assets?name=$(basename\
        \ \"$file\")\")\n        echo \"Upload response: $upload_response\"\n        if echo \"$upload_response\" | jq -e\
        \ '.browser_download_url' > /dev/null 2>&1; then\n            echo \"Successfully uploaded $file\"\n             \
        \         uploaded_images=$((uploaded_images + 1))\n            download_url=$(echo \"$upload_response\" | jq -r '.browser_download_url')\n\
        \            echo \"Download URL: $download_url\"\n        else\n            echo \"Failed to upload $file\"\n   \
        \         echo \"Response: $upload_response\"\n        fi\n    else\n        echo \"File $file does not exist, is\
        \ too small (< 10MB), or is too large (> 2GB)\"\n        if [ -f \"$file\" ]; then\n            file_size=$(stat -c\
        \ %s \"$file\")\n            echo \"File size: $file_size bytes\"\n        fi\n    fi\n    echo \"Cleaning up files\
        \ for CentOS $version\"\n    rm -f centos-${version}.qcow2 centos${version}.qcow2 centos-${version}.qcow2.bak\n  \
        \  echo \"=== Completed processing CentOS $version ===\"\n    echo \"\"\ndone\necho \"All CentOS versions processed!\"\
        \nif (( uploaded_images == 0 )); then echo \"No images were published\" >&2; exit 1; fi\n"
    timeout-minutes: 180
    env:
      LIBGUESTFS_BACKEND: direct
      LIBGUESTFS_BACKEND_SETTINGS: passt:no
'on':
  schedule:
  - cron: 34 17 * * *
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: cloud-image-${{ github.workflow }}
  cancel-in-progress: false
