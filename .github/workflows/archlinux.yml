name: Build Arch Linux Cloud Images
jobs:
  build_archlinux_cloud_images:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: check path
      run: |
        pwd
    - name: Configure Git
      run: |
        git config --global user.name "daily-update"
        git config --global user.email "tg@spiritlhl.top"
    - name: Environment preparation
      run: |
        bash .github/scripts/prepare_guestfs.sh
    - name: Build Arch Linux Images
      run: |
        set -euo pipefail
        uploaded_images=0
        export LIBGUESTFS_BACKEND=direct
        echo "=== Processing Arch Linux ==="
        rm -f archlinux.qcow2 archlinux-custom.qcow2 archlinux-latest.qcow2
        echo "Downloading Arch Linux Cloud Image"
        download_success=0
        for download_url in \
            "https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2" \
            "https://europe.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2" \
            "https://america.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2" \
            "https://asia.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2" \
            "https://mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2"; do
            echo "Trying mirror: $download_url"
            rm -f archlinux.qcow2
            if axel -n 8 -o archlinux.qcow2 "$download_url" 2>/dev/null; then
                :
            else
                curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 300 -o archlinux.qcow2 "$download_url" 2>/dev/null || true
            fi
            if [ -f "archlinux.qcow2" ] && [ $(stat -c %s "archlinux.qcow2") -gt 10485760 ]; then
                echo "Successfully downloaded from: $download_url"
                download_success=1
                break
            fi
            rm -f archlinux.qcow2
        done
        if [ $download_success -ne 1 ]; then
            echo "Failed to download Arch Linux from all mirrors, exiting..."
            exit 1
        fi
        chmod 644 archlinux.qcow2
        # 先检查镜像信息并动态检测根分区
        echo "Checking image info..."
        virt-filesystems -a archlinux.qcow2 --long -h --uuid || true
        echo "Detecting root partition..."
        root_part=$(virt-filesystems -a archlinux.qcow2 --filesystems --long | awk '$1 ~ /^\/dev\/(sd[a-z]|vd[a-z])[0-9]+$/ && $3 ~ /^(ext4|btrfs|xfs)$/ {print $1}' | tail -1)
        if [[ -z "$root_part" ]]; then
            echo "No physical root filesystem partition was detected" >&2
            exit 1
        fi
        echo "Detected physical root partition: $root_part"
        qemu-img create -f qcow2 archlinux-expanded.qcow2 6G
        if ! virt-resize --expand "$root_part" archlinux.qcow2 archlinux-expanded.qcow2; then
            echo "Failed to resize the root partition; refusing to expand the EFI partition" >&2
            exit 1
        fi
        echo "Customizing Arch Linux image - Phase 1: Basic Setup"
        if ! timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 \
          --smp 1 \
          --timezone Asia/Hong_Kong \
          --append-line "/etc/default/grub:# disables OS prober to avoid loopback detection which breaks booting" \
          --append-line "/etc/default/grub:GRUB_DISABLE_OS_PROBER=true"; then
            echo "Failed to setup basic configuration, exiting..."
            rm -f archlinux.qcow2 archlinux-expanded.qcow2
            exit 1
        fi

        echo "Customizing Arch Linux image - Phase 2: GRUB and Services"
        if ! timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 \
          --run-command "grub-mkconfig -o /boot/grub/grub.cfg || grub2-mkconfig -o /boot/grub2/grub.cfg || true" \
          --run-command "systemctl enable serial-getty@ttyS1.service || true" \
          --run-command "sync"; then
            echo "Failed to configure GRUB and services, exiting..."
            rm -f archlinux.qcow2 archlinux-expanded.qcow2
            exit 1
        fi
        sleep 5

        echo "Customizing Arch Linux image - Phase 3: Package configuration"
        # Run package setup as one script so cleanup also runs after failures.
        if ! timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 \
          --append-line "/etc/systemd/timesyncd.conf:NTP=time.apple.com time.windows.com" \
          --run .github/scripts/configure_arch_guest.sh; then
            echo "Failed to configure or validate Arch Linux, exiting..."
            rm -f archlinux.qcow2 archlinux-expanded.qcow2
            exit 1
        fi
        echo "Configuring SSH and root access for Arch Linux..."
        sudo timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 --run-command "sed -i 's/ssh_pwauth:[[:space:]]*0/ssh_pwauth: 1/g' /etc/cloud/cloud.cfg || true"
        sudo timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 --run-command "systemctl enable sshd || true"
        sudo timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 --run-command "sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/g' /etc/ssh/sshd_config || true"
        sudo timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 --run-command "sed -i 's/#PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config || true"
        sudo timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 --run-command "sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config || true"
        sudo timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 --run-command "sed -i 's/#Port 22/Port 22/g' /etc/ssh/sshd_config || true"
        sudo timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 --run-command "sed -i 's/#AddressFamily any/AddressFamily any/g' /etc/ssh/sshd_config || true"
        sudo timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 --run-command "sed -i 's/#ListenAddress 0.0.0.0/ListenAddress 0.0.0.0/g' /etc/ssh/sshd_config || true"
        sudo timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 --run-command "sed -i 's/#ListenAddress ::/ListenAddress ::/g' /etc/ssh/sshd_config || true"
        echo "Configuring qemu-guest-agent for Arch Linux..."
        echo "Setting root password and MOTD for Arch Linux..."
        sudo timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 --run-command "echo root:oneclickvirt | chpasswd"
        sudo timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 --run-command "echo '' > /etc/motd"
        sudo timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 --run-command "echo 'Modified from https://github.com/oneclickvirt/pve_kvm_images' >> /etc/motd"
        sudo timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 --run-command "echo 'Related repo https://github.com/spiritLHLS/pve' >> /etc/motd"
        sudo timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 --run-command "echo '--by https://t.me/spiritlhl' >> /etc/motd"
        # 安全加固：禁用algif_aead模块（CVE防护）
        sudo timeout --kill-after=30s 45m virt-customize -a archlinux-expanded.qcow2 --run-command "mkdir -p /etc/modprobe.d && echo 'install algif_aead /bin/false' > /etc/modprobe.d/disable-algif.conf"
        echo "Compressing Arch Linux image"
        if ! TMPDIR="$(pwd)" timeout --kill-after=30s 45m virt-sparsify --compress --check-tmpdir=ignore archlinux-expanded.qcow2 archlinux-custom.qcow2; then
            echo "Failed to compress Arch Linux image, exiting..."
            rm -f archlinux.qcow2 archlinux-expanded.qcow2 archlinux-custom.qcow2
            exit 1
        fi
        mv archlinux-custom.qcow2 archlinux-latest.qcow2
        ls -lh archlinux-latest.qcow2
        file="archlinux-latest.qcow2"
        if [ -f "$file" ] && [ $(stat -c %s "$file") -gt 10485760 ] && [ $(stat -c %s "$file") -le 2147483648 ]; then
            echo "Processing file: $file"
            release_id=$(curl -fsS --retry 3 --connect-timeout 10 --max-time 120 -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${{ github.repository }}/releases/tags/archlinux" | jq -r '.id')
            if [ "$release_id" = "null" ] || [ -z "$release_id" ]; then
                echo "Release 'archlinux' not found, please create it first"
                rm -f archlinux.qcow2 archlinux-expanded.qcow2 archlinux-latest.qcow2
                exit 1
            fi
            echo "Found release ID: $release_id"
            echo "Checking if $file already exists in release..."
            existing_asset_id=$(curl -fsS --retry 3 --connect-timeout 10 --max-time 120 -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${{ github.repository }}/releases/$release_id/assets" | jq -r --arg name "$(basename "$file")" '.[] | select(.name == $name) | .id')
            if [ -n "$existing_asset_id" ] && [ "$existing_asset_id" != "null" ]; then
                echo "Asset $file already exists in release, deleting existing asset..."
                delete_response=$(curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/releases/assets/$existing_asset_id")
                echo "$delete_response"
                if [ $? -eq 0 ] && ! echo "$delete_response" | grep -q "error"; then
                    echo "Existing asset deleted successfully."
                else
                    echo "Failed to delete existing asset for $file. Skipping file upload..."
                    rm -f archlinux.qcow2 archlinux-expanded.qcow2 archlinux-latest.qcow2
                    exit 1
                fi
            else
                echo "No existing $file file found in release."
            fi
            echo "Uploading $file to release..."
            upload_response=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              -T "$file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$release_id/assets?name=$(basename "$file")")
            echo "Upload response: $upload_response"
            if echo "$upload_response" | jq -e '.browser_download_url' > /dev/null 2>&1; then
                echo "Successfully uploaded $file"
                              uploaded_images=$((uploaded_images + 1))
                download_url=$(echo "$upload_response" | jq -r '.browser_download_url')
                echo "Download URL: $download_url"
            else
                echo "Failed to upload $file"
                echo "Response: $upload_response"
            fi
        else
            echo "File $file does not exist, is too small (< 10MB), or is too large (> 2GB)"
            if [ -f "$file" ]; then
                file_size=$(stat -c %s "$file")
                echo "File size: $file_size bytes"
            fi
        fi
        echo "Cleaning up files for Arch Linux"
        rm -f archlinux.qcow2 archlinux-expanded.qcow2 archlinux-latest.qcow2
        echo "=== Completed processing Arch Linux ==="

        if (( uploaded_images == 0 )); then echo "No images were published" >&2; exit 1; fi
    timeout-minutes: 180
    env:
      LIBGUESTFS_BACKEND: direct
      LIBGUESTFS_MEMSIZE: '2048'
'on':
  schedule:
  - cron: 34 19 * * *
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: cloud-image-${{ github.workflow }}
  cancel-in-progress: false
