name: Read-only published PVE initramfs diagnostics
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare read-only TCG inspection tools
        run: bash .github/scripts/prepare_hosted_runtime.sh qemu
      - name: Verify and inspect the actual released initramfs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/inspect_published_initramfs.py
