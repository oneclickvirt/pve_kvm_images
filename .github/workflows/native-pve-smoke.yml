name: Native PVE image smoke
on:
  schedule:
    - cron: '43 3 * * 2'
  workflow_dispatch:
    inputs:
      outer_acceleration:
        description: Acceleration for the disposable PVE host
        type: choice
        options:
          - auto
          - tcg
        default: auto
      scope:
        description: Test all five inputs, or only the VM when diagnosing a VM failure
        type: choice
        options:
          - all
          - vm
        default: all
      vm_execution:
        description: auto uses qm on KVM hosts and direct runner TCG on software hosts; native requires qm
        type: choice
        options:
          - auto
          - native
          - runner
        default: auto
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
concurrency:
  group: native-pve-image-smoke-${{ inputs.outer_acceleration || 'auto' }}-${{ inputs.vm_execution || 'auto' }}
  cancel-in-progress: false
jobs:
  native-pve:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the disposable host runtime
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/prepare_hosted_runtime.sh qemu
      - name: Test images and report the actual pct, qm or direct TCG backend
        env:
          GH_TOKEN: ${{ github.token }}
          OUTER_ACCELERATION: ${{ inputs.outer_acceleration || 'auto' }}
          TEST_SCOPE: ${{ inputs.scope || 'all' }}
          VM_EXECUTION: ${{ inputs.vm_execution || 'auto' }}
        run: python3 .github/scripts/native_pve_smoke.py --outer-accel "$OUTER_ACCELERATION" --scope "$TEST_SCOPE" --vm-execution "$VM_EXECUTION"
